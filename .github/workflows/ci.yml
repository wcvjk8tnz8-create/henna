name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          DOMAIN: '["example.com"]'
          ADMIN: root@example.com
          jwt_secret: ciOnlyJwtSecretValue0123456789abcdef
          HENNA_CREDENTIAL_KEY: ${{ secrets.HENNA_CREDENTIAL_KEY }}
