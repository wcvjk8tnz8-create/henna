name: Deploy Henna Mail to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      domains:
        description: '邮箱域名，JSON 数组，如 ["your.domain"]'
        required: false
        default: '[]'

concurrency:
  group: deploy-henna
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package.json
            worker/package.json

      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Install worker deps
        working-directory: worker
        run: npm install

      # ── 自动创建 / 复用 Cloudflare 资源（全程 API，无需控制台点击）
      - name: Provision D1 / KV / R2
        id: provision
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision.mjs

      - name: Render wrangler.jsonc
        env:
          D1_ID: ${{ steps.provision.outputs.d1_id }}
          KV_ID: ${{ steps.provision.outputs.kv_id }}
          R2_BUCKET: ${{ steps.provision.outputs.r2_bucket }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          MAIL_DOMAINS: ${{ github.event.inputs.domains || secrets.MAIL_DOMAINS }}
        run: node scripts/render-config.mjs

      - name: Apply D1 migrations
        working-directory: worker
        # --accept-data-loss 在 wrangler v3 不存在（v4 才引入），这里不传该参数。
        # 即便这一步失败也不阻断：后续 /api/init 会幂等建表兜底。
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply henna-mail-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Initialize database
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUBDOMAIN: ${{ steps.provision.outputs.subdomain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB="$SUBDOMAIN"
          if [ -z "$SUB" ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | sed -n 's/.*"subdomain":"\([^"]*\)".*/\1/p')
          fi
          URL="https://henna-mail.$SUB.workers.dev"
          echo "worker=$URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/init.json -w "%{http_code}" "$URL/api/init/$JWT_SECRET" || echo 000)
            echo "init attempt $i -> $code"; cat /tmp/init.json; echo
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "### 部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 访问地址：$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下一步：Cloudflare 控制台 → 域名 → Email → Email Routing → Routing rules → Send to Worker → henna-mail" >> "$GITHUB_STEP_SUMMARY"
