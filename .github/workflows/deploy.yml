name: 🚀 Deploy Henna Mail to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'henna-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # 以下三个「可选」：填了就用你已有的资源，留空则自动查找/创建
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}

    steps:
      - name: 🚚 检出代码仓库
        uses: actions/checkout@v4

      - name: ⚙ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🛠️ 校验环境变量
        run: |
          echo "🔐 开始校验环境变量..."
          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\|&]' <<< "$JWT_SECRET"; then
            echo "❌ JWT_SECRET 为空，或含有非法字符（? % # / \ | &）"
            exit 1
          fi
          if ! jq -e 'type == "array"' <<< "$DOMAIN" ; then
            echo "❌ DOMAIN 必须是 JSON 数组，例如 [\"henna.dev\"]"
            exit 1
          fi
          [ -z "$ADMIN" ] && { echo "❌ ADMIN 不能为空"; exit 1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "❌ CLOUDFLARE_ACCOUNT_ID 不能为空"; exit 1; }
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "❌ CLOUDFLARE_API_TOKEN 不能为空"; exit 1; }
          [ -z "$CUSTOM_DOMAIN" ] && echo "::warning:: CUSTOM_DOMAIN 未设置，将使用 workers.dev 子域"
          echo "✅ 环境变量校验通过"

      - name: 📦 构建前端
        working-directory: ./web
        run: |
          npm install
          npm run build
          rm -rf ../worker/dist
          cp -r dist ../worker/dist

      - name: 📦 安装 Worker 依赖
        working-directory: ./worker
        run: |
          npm install
          npx wrangler telemetry disable || true

      # ── 资源全部自动创建/复用；ID 可选，填了就用指定的那个
      - name: 🗄️ 创建 / 复用 D1 · KV · R2
        id: provision
        run: node scripts/provision.mjs

      - name: 🛠️ 渲染配置
        working-directory: ./worker
        env:
          D1_ID: ${{ steps.provision.outputs.d1_id }}
          KV_ID: ${{ steps.provision.outputs.kv_id }}
          R2_BUCKET: ${{ steps.provision.outputs.r2_bucket }}
        run: |
          # 渲染到生成文件：模板 wrangler-action.toml 始终保持不变，重跑不会二次污染
          cp wrangler-action.toml wrangler-deploy.toml
          C=wrangler-deploy.toml
          sed -i "s|\${NAME}|${NAME}|g"                             "$C"
          sed -i "s|\${CLOUDFLARE_ACCOUNT_ID}|${CLOUDFLARE_ACCOUNT_ID}|g" "$C"
          sed -i "s|\${ADMIN}|${ADMIN}|g"                           "$C"
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g"                 "$C"
          sed -i "s|\${D1_DATABASE_ID}|${D1_ID}|g"                  "$C"
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_ID}|g"                 "$C"
          # DOMAIN 是 JSON 数组，去掉包裹引号写成原生数组
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g"                     "$C"
          # R2 不可用时删除该段，附件功能自动降级
          if [ -z "$R2_BUCKET" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' "$C"
            echo "::warning:: 未启用 R2，附件功能降级（只存元信息）"
          else
            sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET}|g" "$C"
          fi
          echo "✅ 渲染完成"

      - name: 🔍 校验渲染结果
        working-directory: ./worker
        run: |
          C=wrangler-deploy.toml
          # 1. 不能有残留占位符
          if grep -v '^\s*#' "$C" | grep -n '\${'; then
            echo "❌ 配置中仍有未替换的占位符"
            exit 1
          fi
          # 2. D1 / KV 的 id 必须非空（空串会让 wrangler 报 id: should be non-empty string）
          if grep -qE '^\s*database_id\s*=\s*""'  "$C"; then echo "❌ D1 database_id 为空"; exit 1; fi
          if grep -qE '^\s*^id\s*=\s*""'          "$C"; then echo "❌ KV id 为空"; exit 1; fi
          # 3. MAIL_DOMAINS 必须是数组形式
          if ! grep -qE '^MAIL_DOMAINS\s*=\s*\['  "$C"; then echo "❌ MAIL_DOMAINS 不是数组"; exit 1; fi
          echo "✅ 渲染结果校验通过"
          grep -E '^(name|database_id|bucket_name)|^\s*id\s*=|MAIL_DOMAINS' "$C" || true

      - name: 🚀 部署 Worker
        id: deploy
        working-directory: ./worker
        run: |
          echo "🚀 开始部署..."
          set +e
          npx wrangler deploy -c wrangler-deploy.toml 2>&1 | tee deploy.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ $CODE -ne 0 ]; then echo "❌ 部署失败"; exit 1; fi
          WORKER_URL=$(grep -o "https://[a-zA-Z0-9.-]*\.workers\.dev" deploy.log | head -1 || echo "")
          # 日志里没打印时，用 API 查到的子域拼一个（wrangler 有时只在首次部署输出 URL）
          if [ -z "$WORKER_URL" ] && [ -n "${{ steps.provision.outputs.subdomain }}" ]; then
            WORKER_URL="https://$NAME.${{ steps.provision.outputs.subdomain }}.workers.dev"
            echo "· 日志未输出地址，改用 API 子域拼接：$WORKER_URL"
          fi
          [ -n "$WORKER_URL" ] && echo "::add-mask::$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ 部署完成：$WORKER_URL"

      - name: ♻️ 初始化数据库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ steps.provision.outputs.subdomain }}
        run: |
          echo "🛠️ 开始初始化数据库..."

          # ── 收集所有可能的访问地址（去重）
          CANDIDATES=""
          add_candidate() {
            for c in $CANDIDATES; do [ "$c" = "$1" ] && return; done
            CANDIDATES="$CANDIDATES $1"
          }
          [ -n "$CUSTOM_DOMAIN" ] && add_candidate "https://$CUSTOM_DOMAIN"
          [ -n "${{ steps.deploy.outputs.worker_url }}" ] && add_candidate "${{ steps.deploy.outputs.worker_url }}"
          [ -n "$SUBDOMAIN" ] && add_candidate "https://$NAME.$SUBDOMAIN.workers.dev"
          if [ -z "$CANDIDATES" ]; then
            echo "::warning:: 拿不到访问地址，跳过自动初始化。请打开 Cloudflare 控制台查看 Worker 地址后手动访问 /api/init/<JWT_SECRET>"
            exit 0
          fi
          echo "· 候选地址：$CANDIDATES"

          # 新部署的 workers.dev 主机名 DNS 生效可能需要几分钟，这里给足轮询时间
          for round in $(seq 1 12); do
            for BASE in $CANDIDATES; do
              # --ipv4 规避 runner 的 IPv6 解析问题；--max-time 防挂死
              CODE=$(curl -4 -sL --max-time 20 -o /tmp/henna-init.txt \
                     -w '%{http_code}' "$BASE/api/init/${JWT_SECRET}" 2>/dev/null)
              CODE="${CODE:-000}"
              BODY=$(head -c 200 /tmp/henna-init.txt 2>/dev/null || echo "")
              echo "· 第 $round 轮 $BASE -> HTTP $CODE${BODY:+ / $BODY}"
              if [ "$BODY" = "success" ]; then
                echo "✅ 数据库初始化完成"
                echo "### 部署结果" >> "$GITHUB_STEP_SUMMARY"
                echo "- 访问地址：$BASE" >> "$GITHUB_STEP_SUMMARY"
                echo "- 附件存储：${{ steps.provision.outputs.r2_enabled == 'true' && '已启用 R2' || '未启用（功能降级）' }}" >> "$GITHUB_STEP_SUMMARY"
                echo "- 下一步：Cloudflare 控制台 → 域名 → Email → Email Routing → Routing rules → Send to Worker → $NAME" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            [ $round -lt 12 ] && sleep 15
          done

          # 走到这里说明自动初始化没成功 —— 但 Worker 本身已部署成功，
          # 不该因为这一步把整次部署标红，改为警告 + 给出手动地址。
          echo "::warning:: 自动初始化未成功（Worker 已部署，只是 CI 连不上它的地址）"
          FIRST_URL=$(echo "$CANDIDATES" | awk '{print $1}')
          echo ""
          echo "   请在浏览器里手动打开下面这个地址完成建表（一次即可）："
          echo "     $FIRST_URL/api/init/<你的 JWT_SECRET>"
          echo ""
          echo "   若该地址打不开，说明 workers.dev 主机名还没生效："
          echo "   等 2~3 分钟再刷新，或到 Cloudflare 控制台 → Workers → $NAME 查看真实地址。"
          echo "### ⚠️ 需要手动初始化" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker 已部署成功，但 CI 无法访问其地址完成建表。请手动打开：" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FIRST_URL/api/init/<你的 JWT_SECRET>\`" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 🗑️ 清理运行记录
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '1'
          keep_minimum_runs: '0'
